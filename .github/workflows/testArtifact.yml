name: artificate
on: 
  workflow_dispatch: 
  
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
    
      - run: |
        mkdir -p dist
        echo "Application package" > dist/app.txt
      - uses: actions/upload-artifact@v4
      with:
      name: app-package
      path: dist/
# Later job: download the same artifact
      - uses: actions/download-artifact@v4
      with:
      name: app-package
      path: deploy-package
