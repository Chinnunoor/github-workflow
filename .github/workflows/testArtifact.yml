name: Artifact

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Create application package
        run: |
          mkdir -p dist
          echo "Application package" > dist/app.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: deploy-package

      - name: Check downloaded artifact
        run: |
          ls -R deploy-package
          cat deploy-package/app.txt
